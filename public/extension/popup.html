<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JobQuest Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #08090a;
      color: #f0f2f5;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      font-family: monospace;
    }
    .badge.connected {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .badge.disconnected {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .content {
      font-size: 12px;
      color: #8b929e;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #f0f2f5;
      color: #08090a;
      font-weight: 600;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      background: #d4d8e0;
    }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
      color: #545b68;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">JobQuest Agent</div>
    <div id="statusBadge" class="badge disconnected">Disconnected</div>
  </div>
  <p class="content" id="statusDesc">
    Connect your extension to JobQuest AI to enable one-click form autofill and job syncing.
  </p>
  <button id="toggleBtn" class="btn">Connect Dashboard</button>
  <div class="footer">v1.0.0 · JobQuest AI</div>

  <script src="popup.js"></script>
</body>
</html>
